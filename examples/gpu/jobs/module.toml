# G15: the normal manifest gate for the v2 job/buffer surface.
#
# These are ordinary `rs_*` extern symbols: the bridge's
# `check_call_permission` compares each JIT call against this list before the
# symbol is resolved. The whole `Jobs` module is compiled, so every wrapper it
# contains names its symbol even when this example does not call it; the header
# therefore grants the complete v2 surface. Removing one must fail with UK-4001
# before the corresponding operation runs.
[module]
name = "GpuJobs"

[grants]
kernel = [
    "rs_gpu_open",
    "rs_gpu_close",
    "rs_gpu_buffer_new",
    "rs_gpu_buffer_free",
    "rs_gpu_submit",
    "rs_gpu_poll",
    "rs_gpu_cancel",
    # The three calls that carry a byte buffer are mediated: a buffer is always
    # routed through the generated wrapper, so the CPS names these symbols and
    # the native `rs_gpu_buffer_write`/`_read`/`rs_gpu_result` are unreachable
    # from a module. Their descriptors are `abi buffer 2` (the handles and the
    # offset are 64-bit words beside the buffer, not lengths).
    "rs_gpu_buffer_write__adapter",
    "rs_gpu_buffer_read__adapter",
    "rs_gpu_result__adapter",
]
