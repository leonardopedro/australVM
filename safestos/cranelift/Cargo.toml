[package]
name = "austral_cranelift_bridge"
version = "0.1.0"
edition = "2021"

[lib]
# rlib so in-crate binaries (src/bin/modhost.rs) can link the bridge as a normal
# Rust dependency; cdylib/staticlib remain for the OCaml FFI link.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Use latest stable Cranelift (0.131)
cranelift = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
target-lexicon = "0.13"
cedar-policy = { version = "4.11.2", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unfer_ffi = { path = "../../../unfer/unfer_ffi", optional = true }
arctic_authority = { path = "../../arctic_authority", optional = true }
arctic = { path = "../../../dynamic-arctic", optional = true }
serde_json = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
libc = "0.2"
frunk = { version = "0.4", optional = true }
cap-std = { version = "3", optional = true }
unfer_consensus = { path = "../../../unfer/unfer_consensus", optional = true }
unfer_identity = { path = "../../../unfer/unfer_identity", optional = true }
unfer_data = { path = "../../../unfer/unfer_data", optional = true }
unfer_protocol = { path = "../../../unfer/unfer_protocol" }
# Tidepool: Haskell effect-stack → Cranelift JIT (separate JIT context, cranelift 0.129.1)
# Pinned to rev ac0a95ddb07cbb996ba2b5bf1fd0772ca9315ef1.
# Uncomment when building with --features tidepool (requires network for git fetch):
# tidepool-runtime = { git = "https://github.com/tidepool-heavy-industries/tidepool", rev = "ac0a95ddb07cbb996ba2b5bf1fd0772ca9315ef1", optional = true }
# tidepool-effect = { git = "https://github.com/tidepool-heavy-industries/tidepool", rev = "ac0a95ddb07cbb996ba2b5bf1fd0772ca9315ef1", optional = true }
# tidepool-bridge-derive = { git = "https://github.com/tidepool-heavy-industries/tidepool", rev = "ac0a95ddb07cbb996ba2b5bf1fd0772ca9315ef1", optional = true }
# tidepool-codegen = { git = "https://github.com/tidepool-heavy-industries/tidepool", rev = "ac0a95ddb07cbb996ba2b5bf1fd0772ca9315ef1", optional = true }
# tidepool-repr = { git = "https://github.com/tidepool-heavy-industries/tidepool", rev = "ac0a95ddb07cbb996ba2b5bf1fd0772ca9315ef1", optional = true }

[features]
default = ["cedar", "unfer-kernel"]
cedar = ["dep:cedar-policy"]
unfer-kernel = ["dep:unfer_ffi"]
zenodo-store = ["dep:unfer_ffi", "unfer_ffi/zenodo"]
arctic-auth = ["dep:arctic_authority", "dep:arctic", "dep:serde_json"]
tidepool = ["dep:frunk"]
capstd = ["dep:cap-std"]
federation = ["dep:unfer_consensus", "dep:unfer_identity", "dep:unfer_data"]
# ECMAScript module backend (S1): workerd sidecar supervisor + kernel capability loopback.
# The workerd binary itself is a sidecar process located via $UNFER_WORKERD (see ecma.rs).
ecmascript = ["unfer-kernel", "dep:serde_json", "dep:hex"]
# S3: OS sandbox layer — dedicated launcher wrapping the workerd sidecar in user/network/pid
# namespaces + no_new_privs + seccomp-bpf + Landlock (browser-equivalent, no full VM).
sandbox = ["ecmascript"]

# Test helpers: provides stub C runtime symbols (au_alloc, au_free, etc.)
# so integration tests can link without the real safestos C runtime.
# Active only when explicitly requested (e.g. `cargo test --features test-stubs`).
test-stubs = []

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true

[[test]]
name = "ecmascript_module"
required-features = ["ecmascript"]
