[package]
name = "avm-gpu"
version = "0.1.0"
edition = "2021"
description = "Independent bundle checker and KernelIR reference evaluator for Austral GPU kernels"
license = "Apache-2.0"

[lib]
name = "avm_gpu"
path = "src/lib.rs"
# G14: the same library is also a cdylib so a deployment can load the
# manifest-gated `rs_gpu_*` adapter without a second crate. The default build
# still has no device dependency.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "avm-gpu"
path = "src/bin/avm-gpu.rs"

# G21a: launch the published NVIDIA artifact. Optional, like `device`: the
# default build has no CUDA dependency at all, and this binary drives the
# installed driver through dlopen rather than linking it.
[[bin]]
name = "avm-nvlaunch"
path = "src/bin/avm-nvlaunch.rs"
required-features = ["nvidia"]

# PC10: the virtual/native boundary. `claim` and `identify` are CPU-only, so
# this binary is built by default; `capture` needs the same optional `nvidia`
# driver path as `avm-nvlaunch` and reports an unavailable driver otherwise.
[[bin]]
name = "avm-target"
path = "src/bin/avm-target.rs"

[dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# G09: optional adapter probe. Backends are selected deliberately; the crate
# never enables wgpu for the default (CPU-only) build.
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["wgsl", "vulkan", "gles", "metal", "dx12"] }
pollster = { version = "0.4", optional = true }

[features]
default = []
# Device support (G09/G10) is deliberately optional: the default crate only
# parses, validates and evaluates.
device = ["dep:wgpu", "dep:pollster"]
# G14: the manifest-gated `rs_gpu_*` service exports. It deliberately does not
# imply `device`: a CPU-only deployment can load the service and refuse a
# `require_hardware` request instead of silently using the reference path.
service = []
# G21a: the CUDA Driver API backend. No crate dependency is added; the library
# is opened with dlopen at run time, so enabling this feature does not require
# a CUDA toolkit at build time.
nvidia = []
