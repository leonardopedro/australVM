[workspace]
resolver = "2"
members = ["avm-cas", "avm-eval", "avm-exec", "avm-cli"]

# PLAN_avm_pkg.md — the avm-pkg package engine core. Standalone workspace
# (like safestos/cranelift): dependencies are pure crates from the shared
# offline cargo cache plus the *in-workspace* member crates only — no path
# deps outside this directory, so resolution can never drag another repo's
# (unfer's) git-dependency graph in. The Cranelift bridge is reached by
# spawning its `cps2cell` helper, not by linking it (spec §6.2 separation).

[workspace.package]
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[workspace.dependencies]
blake3 = "1.8"
dashmap = "6"
ed25519-dalek = "2"
lz4_flex = "0.11"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Sprint 5.1 — remote binary cache (reqwest + tokio, per spec §3.4/roadmap).
# No TLS features: the acceptance tests run against a loopback REST mock,
# and this machine has no egress; S3-over-HTTPS lands with SigV4 later.
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
# Sprint 3 — capability policy engine for the sandbox runner (spec §3.1,
# "Cedar capability queries"); 4.12 is in the offline cache.
cedar-policy = "4.12"
