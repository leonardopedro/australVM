[workspace]
resolver = "2"
members = ["avm-cas", "avm-eval", "avm-cli"]

# PLAN_avm_pkg.md — the avm-pkg package engine core. Standalone workspace
# (like safestos/cranelift): pure-crate dependencies only, no path deps, so
# it builds offline from the shared cargo cache and can never drag the
# unfer git-dependency graph into resolution.

[workspace.package]
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[workspace.dependencies]
blake3 = "1.8"
dashmap = "6"
ed25519-dalek = "2"
lz4_flex = "0.11"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
