[package]
name = "avm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# PLAN_avm_pkg.md Sprint 4 — the `avm-pkg` command line. Every spec
# subcommand is wired to its backing subsystem (avm-cas, avm-eval,
# avm-exec, and avm-cas::remote); a command that cannot run honestly
# fails loudly rather than faking coverage.

[[bin]]
name = "avm-pkg"
path = "src/main.rs"

[dependencies]
avm-cas = { path = "../avm-cas" }
avm-eval = { path = "../avm-eval" }
avm-exec = { path = "../avm-exec" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
