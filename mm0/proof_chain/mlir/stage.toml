# mm0/proof_chain/mlir/stage.toml — PC09's declared MLIR stage boundary.
#
# The pre-MLIR side of `Austral → KernelIR → MLIR → device IR` exists and is
# pinned by PC04/PC07 (`clamp_source.mm0` reflects this KernelIR and PC07
# composes it). The emitter is `G20a` (`lib/gpu/Gpu_mlir.ml`), and `G19a` pins a
# real LLVM 19.1.7 round trip that verifies and lowers the emitted module to
# `sm_70` PTX. MLIR *semantics* is still absent: no pass-local relation is
# stated or proved. So this record declares the route, pins the subject
# identity, and marks each pass either captured (with a measured pre/post pair)
# or explicitly uncaptured.
#
# `scripts/mlir-chain check` re-derives the subject from
# `mm0/proof_chain/clamp_source.mm0`, requires exactly the route's passes and
# the pinned options, and refuses a `captured` row whose IR file is missing.
# It prints `[gap] PC09: no MLIR capture exists` while any pass is uncaptured:
# a declared boundary is not a preservation proof.

[subject]
module = "clamp"
entry = "clamp"
comparison = "GreaterThan"
kernel_ir_sha256 = "48caf04ea1714fba539ab596cd83d4f7ab537f3eea7837a5b129ccbecb9d8288"
source_artifact = "mm0/proof_chain/clamp_source.mm0"
dialect_profile = "none — no MLIR dialect semantics is declared"
captured_passes = 4

[[option]]
name = "numeric_profile"
value = "u32-modular-v1"

[[option]]
name = "extents"
value = "static"

[[option]]
name = "fast_math"
value = "forbidden"

[[option]]
name = "fusion"
value = "forbidden"

[[option]]
name = "shared_memory"
value = "forbidden"

[[option]]
name = "target"
value = "mlir-gpu-dialect (no native lowering declared)"

[[pass]]
name = "kernelir-to-mlir"
state = "captured"
pre_file = "clamp.kernelir"
pre_sha256 = "52d01cfaade3df43f28ad9e017b07b97d123f498563fb3a22c0cc075864db5a5"
post_file = "clamp.mlir"
post_sha256 = "e17b0a0b6b4ab20dc8d0be93c58fb51f9e7c0535ba3c93961381c1bab1abbd58"
detail = "Gpu_mlir.render ~extent:65 of the reflected KernelIR: captured byte-for-byte, not proved (no MLIR semantics)"
[[pass]]
name = "mlir-canonicalize"
state = "captured"
pre_file = "clamp.mlir"
pre_sha256 = "e17b0a0b6b4ab20dc8d0be93c58fb51f9e7c0535ba3c93961381c1bab1abbd58"
post_file = "clamp.canonical.mlir"
post_sha256 = "5acf98dc750edcb131ed4aacadfdabc31c69948c0c5992e93518f4e2cb8c19c8"
detail = "mlir-opt --canonicalize of the captured module: captured byte-for-byte, not proved (no MLIR semantics)"
[[pass]]
name = "mlir-lower-to-nvvm-input"
state = "captured"
pre_file = "clamp.canonical.mlir"
pre_sha256 = "5acf98dc750edcb131ed4aacadfdabc31c69948c0c5992e93518f4e2cb8c19c8"
post_file = "clamp.pre-nvvm.mlir"
post_sha256 = "34d0edabddd0fdd8c223428ee1342741366aa44be14bc3a08e7d110eab698ad9"
detail = "the pinned pipeline's passes before `convert-gpu-to-nvvm` (convert-nvgpu-to-nvvm, gpu-kernel-outlining, convert-vector-to-scf, convert-scf-to-cf, convert-nvvm-to-llvm, convert-func-to-llvm, expand-strided-metadata, nvvm-attach-target, lower-affine, convert-arith-to-llvm, convert-index-to-llvm, canonicalize, cse, strip-debuginfo), captured as one segment: its endpoints are real pipeline bytes, its interior is not individually pinned, and it is not proved"

[[pass]]
name = "convert-gpu-to-nvvm"
state = "captured"
pre_file = "clamp.pre-nvvm.mlir"
pre_sha256 = "34d0edabddd0fdd8c223428ee1342741366aa44be14bc3a08e7d110eab698ad9"
post_file = "clamp.post-nvvm.mlir"
post_sha256 = "7b71782b5d407e7a095c648bd874ab58896f3c15d55d2d8a1e101ea546d07340"
detail = "the pinned pipeline's own pre/post at this pass, read from its before/after dumps; the run's gpu.object assembly unescapes to the PTX G19a recorded, so this is that lowering; captured, not proved"

[[pass]]
name = "nvvm-to-ptx"
state = "uncaptured"
detail = "canonicalize, cse, reconcile-unrealized-casts, gpu-to-llvm, gpu-module-to-binary follow; G19a pins the PTX they produce, but these passes are not captured and no pass-local relation is proved for them or for the pair above"

