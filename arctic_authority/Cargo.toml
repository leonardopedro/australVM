[package]
name = "arctic_authority"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Threshold-signed collective AuthorizationEngine backend for australVM, built on the Arctic deterministic two-round threshold Schnorr scheme (../dynamic-arctic)."

[dependencies]
arctic = { path = "../../dynamic-arctic" }
curve25519-dalek = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
