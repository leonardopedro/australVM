name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Core: the cranelift bridge must build, test and lint on CPU, and the OCaml
  # compiler suite must pass against the built bridge.
  #
  # The bridge path-depends on unfer and dynamic-arctic as SIBLINGS of the
  # checkout root (safestos/cranelift/Cargo.toml resolves ../../../unfer and
  # ../../../dynamic-arctic), so both live one level up — the same sibling
  # layout the workspace uses. NOTE: actions/checkout refuses paths outside
  # $GITHUB_WORKSPACE ("Repository path ... is not under ..." guard), so the
  # siblings are cloned with plain git instead of a second checkout action.
  # `cargo build --release` produces the libaustral_cranelift_bridge.so that
  # the OCaml tests dlopen.
  # ---------------------------------------------------------------------------
  test:
    name: bridge test + OCaml suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
      - name: Checkout unfer as sibling (Cargo.toml path dep ../../../unfer)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - name: Checkout dynamic-arctic as sibling (unfer_consensus dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # Swatinem/rust-cache@v2
        with:
          workspaces: safestos/cranelift
      # The .so is built in release (the Makefile's BRIDGE_DIR); debug `cargo
      # test` keeps the fast unit suites fast.
      - name: build bridge (release, for the OCaml .so)
        run: cargo build --release --manifest-path safestos/cranelift/Cargo.toml
      - name: cargo test (bridge workspace)
        run: cargo test --manifest-path safestos/cranelift/Cargo.toml
      # OCaml suite via the flake (ocaml, dune, yojson, ounit2, ...). The test
      # binaries dlopen the bridge .so, so LD_LIBRARY_PATH points at the
      # release dir — mirroring `make test`.
      #
      # lib/BuiltInModules.ml is GENERATED (concat_builtins.py) and
      # gitignored, so a fresh checkout lacks it and dune 3.x refuses to
      # build the interface-only BuiltInModules module. The Makefile's
      # `make test` target generates it as an implicit prerequisite of the
      # $(BIN) rule — CI must do the same before dune runs.
      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14  # DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4  # DeterminateSystems/magic-nix-cache-action@v9
      - name: dune runtest (OCaml compiler suite)
        run: |
          nix develop -c bash -c 'export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; python3 concat_builtins.py && dune runtest'
      # memsafe (docs/memsafe.md §6): the linearity ledger is the *compiler's*
      # output, so this job — the only one that builds austral.exe — is where
      # the pinned ledger can be re-derived and compared. `ledger2mm0 check`
      # then pins the certificate to that ledger and to docs/memsafe.mm0, and
      # `selftest` requires the emitter's audit to refuse a trace whose
      # resource is never released (no mm0 toolchain needed for either; the
      # root-of-trust half runs in phase-d).
      - name: memsafe ledger gate (fixture → pinned ledger → certificate)
        run: |
          nix develop -c bash -c 'export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; \
            ./_build/default/bin/austral.exe compile mm0/fixtures/linearity_ledger.aum \
              --target-type=c --no-entrypoint --output=/tmp/ll.c \
              --emit-linearity-ledger=/tmp/ll.json && \
            diff -u mm0/ledgers/linearity_ledger.json /tmp/ll.json && \
            python3 scripts/ledger2mm0 check && \
            python3 scripts/ledger2mm0 selftest && \
            python3 scripts/service_iso2mm0 check && \
            python3 scripts/service_iso2mm0 selftest'

  lint:
    name: clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
      - name: Checkout unfer as sibling (Cargo.toml path dep ../../../unfer)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - name: Checkout dynamic-arctic as sibling (unfer_consensus dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # Swatinem/rust-cache@v2
        with:
          workspaces: safestos/cranelift
      # Clippy is enforced with -D warnings: the bridge was swept clean (round
      # 21) — every FFI entry point carries an explicit
      # `#[allow(clippy::not_unsafe_ptr_arg_deref)]` for its C ABI pointers.
      - run: cargo clippy --manifest-path safestos/cranelift/Cargo.toml --all-targets -- -D warnings
      # Formatting is enforced too (round-21 follow-up): the bridge crate was
      # made fmt-clean with the pinned 1.99.0 rustfmt (rust-toolchain.toml
      # governs every cargo invocation here, so the runner's default stable
      # never drifts the gate — unlike an unpinned @nightly format job).
      # Scoped via --manifest-path so the sibling path deps (unfer,
      # dynamic-arctic) are never reformatted by this job.
      - run: cargo fmt --manifest-path safestos/cranelift/Cargo.toml -- --check

  # ---------------------------------------------------------------------------
  # Phase D: the Lean4 → DeltaNets → MM0 certificate gate (docs/lean4mm0.md §5).
  # Regenerates BOTH certificates (gap_certificate, layout_certificate) from
  # the pinned nanoda-verified lean4export fixtures in sibling unfer, fails
  # on drift against the committed MM0/MM1, then drives the frozen root of
  # trust: mm0-rs elaborates the .mm1 proofs into an .mmb and mm0-c — the
  # <3k-line C verifier, outside every other checker's TCB — re-verifies it
  # against the .mm0 spec. A warning from mm0-rs is a proof hole: it fails.
  #
  # It also provisions metamath/{set.mm0,set.mmu} (see the block below) so the
  # set.mm statement layer — the 7/8 quasi-Riemann axiom — verifies over the
  # imported corpus instead of reporting an explained gap (§11).
  #
  # The mm0 toolchain is built from digama0/mm0 at the same commit the
  # provisioned host uses (the verifier is frozen: an update is an event,
  # not a rebuild).
  # ---------------------------------------------------------------------------
  phase-d:
    name: Phase D (lean2mm0 + mm0-c root of trust)
    runs-on: ubuntu-latest
    env:
      # Pinned metamath/set.mm source for the imported theory — byte-identical
      # (sha256 below) to the set.mm the provisioned host generated its
      # set.mm0/set.mmu from (docs/lean4mm0.md §11). Bump the rev and the hash
      # together; both feed the theory cache key.
      SET_MM_REV: b975dbbd636372803f3102045aa333771f25a477
      SET_MM_SHA256: 39c9f7304a1928d56b12e0e04ef76b40805f0c899b516f695d840f6f5f67f788
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
      - name: Checkout unfer as sibling (pinned lean4export fixtures)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # dtolnay/rust-toolchain@stable
      - name: Build the frozen mm0 toolchain (mm0-rs + mm0-c, digama0/mm0)
        run: |
          git clone https://github.com/digama0/mm0.git ../mm0
          git -C ../mm0 checkout 0d414c0bfdaaeb7fea571895127abc1fa5a3d956
          cargo install --path ../mm0/mm0-rs --root "$HOME/.local"
          gcc ../mm0/mm0-c/main.c -O2 -o "$HOME/.local/bin/mm0-c"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # ---------------------------------------------------------------------
      # Provision the imported theory (docs/lean4mm0.md §11): the statement
      # layer imports set.mm instead of re-axiomatizing it, so its verify path
      # needs metamath/{set.mm0,set.mmu} — 568 MB of untracked toolchain state
      # that cannot be committed and would otherwise print `[gap]` and skip
      # the statement stem. set.mm is fetched from a pinned rev (sha256-checked
      # against the host's copy), and the generated pair comes back from the
      # actions/cache unless its inputs — source rev, the from-mm compat
      # patch, the flake (which pins nixpkgs/GHC) — changed, in which case
      # nix builds mm0-from-mm and regenerates it (cold path, a few minutes).
      # ---------------------------------------------------------------------
      - name: Fetch the pinned set.mm source
        run: |
          mkdir -p mm0/metamath
          curl -fsSL -o mm0/metamath/set.mm "https://raw.githubusercontent.com/metamath/set.mm/$SET_MM_REV/set.mm"
          echo "$SET_MM_SHA256  mm0/metamath/set.mm" | sha256sum -c -
      - name: Restore the provisioned theory (set.mm0 + set.mmu)
        id: theory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # actions/cache@v4
        with:
          path: mm0/metamath
          key: metamath-${{ env.SET_MM_REV }}-${{ hashFiles('mm0/from-mm-compat.patch', 'flake.lock') }}
      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14  # DeterminateSystems/nix-installer-action@v14
        if: steps.theory.outputs.cache-hit != 'true'
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4  # DeterminateSystems/magic-nix-cache-action@v9
        if: steps.theory.outputs.cache-hit != 'true'
      - name: Provision set.mm0 + set.mmu (mm0-from-mm, only on a cache miss)
        if: steps.theory.outputs.cache-hit != 'true'
        run: |
          nix build .#mm0-from-mm -o /tmp/mm0-from-mm
          /tmp/mm0-from-mm/bin/mm0-from-mm from-mm mm0/metamath/set.mm \
            -o mm0/metamath/set.mm0 mm0/metamath/set.mmu
          # mm0-rs's reader takes no `pub ` prefix (docs/lean4mm0.md §11)
          sed -i 's/^(pub //' mm0/metamath/set.mmu
      - name: The theory is present (a [gap] here would mean a silent skip)
        run: |
          test -s mm0/metamath/set.mm0
          test -s mm0/metamath/set.mmu
          grep -q '^(sort ' mm0/metamath/set.mmu
      - name: lean2mm0 verify (drift + mm0-rs + mm0-c, certificates + set.mm statement)
        run: |
          set -o pipefail
          python3 scripts/lean2mm0 verify 2>&1 | tee "$RUNNER_TEMP/lean2mm0-verify.log"
          # The statement path must have actually run — labelled grounding and
          # the corrupted-proof refusal both print only when it did, never on
          # the `[gap]` branch.
          grep -q 'label contract grounded' "$RUNNER_TEMP/lean2mm0-verify.log"
          grep -q 'negative anchor OK' "$RUNNER_TEMP/lean2mm0-verify.log"
      # Same root of trust, different subject: the memsafe linearity
      # certificate is derived (no grounded class), so this runs the full
      # verify — drift, mm0-rs elaboration, mm0-c re-verification, and the
      # negative anchor that requires a stale proof to be *rejected* for a
      # mutated timeline (docs/memsafe.md §6).
      - name: ledger2mm0 verify (drift + mm0-rs + mm0-c + mutation anchor)
        run: python3 scripts/ledger2mm0 verify
      # The service-isolation certificate rests on the same root of trust:
      # svcmux's pinned measurements become `isolated` theorems, and the
      # negative anchor must refuse a proof citing the wrong axis's constant.
      - name: service_iso2mm0 verify (drift + mm0-rs + mm0-c + mutation anchor)
        run: python3 scripts/service_iso2mm0 verify