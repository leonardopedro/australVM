name: Build and Test
on:
  pull_request:
  push:
    branches:
      - master

# `make bridge` defaults to `cargo build --offline` (see the Makefile: on the
# development host a crates.io index refresh never completes). A CI runner has
# no warm registry on a cold cache, so offline resolution fails there with
# "no matching package named `cap-std` found" and takes every job that builds
# the bridge down with it. An empty CARGO_FLAGS is set, not unset — `?=` in the
# Makefile must see it defined.
env:
  CARGO_FLAGS: ""

jobs:
  # ── Upstream OCaml CI, migrated from nix-shell (23.05) to the flake ─
  # The fork links the cranelift JIT bridge (.so, DT_NEEDED, no rpath) into
  # every binary, so this job needs the same sibling checkouts as jit-stack
  # and LD_LIBRARY_PATH for every step that runs the `austral` binary.
  build-and-test-linux:
    strategy:
      fail-fast: true

    runs-on:
      - ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # actions/checkout@v3

      # actions/checkout refuses paths outside $GITHUB_WORKSPACE ("Repository
      # path ... is not under ..." guard), so the sibling unfer + dynamic-arctic
      # are cloned with plain git: the bridge Cargo.toml path-depends on
      # ../../../unfer, which in turn path-depends on ../../dynamic-arctic via
      # unfer_consensus.
      - name: Checkout unfer as sibling (bridge path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - name: Checkout dynamic-arctic as sibling (unfer_consensus dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      - name: install nix
        uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703  # nixbuild/nix-quick-install-action@v30

      - name: nix cache
        uses: nix-community/cache-nix-action@d8cff2f74b9341e0d90fbf3c0c0212a161ceaef6  # nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      # `make bridge` (flake env): builds the Rust bridge .so via cargo, then
      # the OCaml compiler against it, and regenerates the gitignored
      # lib/BuiltInModules.ml (concat_builtins.py) on the way. A plain `make`
      # cannot work: the fork's dune files link the .so unconditionally.
      - name: make (build bridge + compiler)
        run: nix develop -c bash -c 'make bridge'

      # `FormalizePluginTest` is the only thing that exercises the `logos unf`
      # compile-time gate added for the kernel work, and six of its sixteen cases
      # read UNFER_LOGOS_BIN: with it unset they print a skip line and report OK.
      # So CI was green against a gate that had never run — it would not have
      # noticed the gate regressing to a no-op. The sibling unfer checkout is
      # already there for the bridge's path dependency, so build the binary from
      # it and point the tests at it.
      - name: build logos (kernel gate binary)
        run: cargo build --release --manifest-path ../unfer/Cargo.toml -p logos

      - name: make test
        run: nix develop -c bash -c 'export UNFER_LOGOS_BIN=$PWD/../unfer/target/release/logos; make test'

      # The default run compiles `DEFAULT_SUITES`, and the collector refuses a
      # suite directory that list does not name. This is the unit test for that
      # rule (scratch directories, no compiler), so a guard that stopped firing
      # is a red step rather than a quietly shortened default run.
      - name: runner suite list is honest
        run: nix develop -c bash -c 'python3 test-programs/test_runner.py'

      # The `austral` binary has no rpath, so every step that runs it needs
      # LD_LIBRARY_PATH pointing at the bridge .so's build dir (make bridge
      # above produced it there) — the ci.yml pattern.
      - name: end-to-end tests
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; python test-programs/runner.py'

      # typecheck gate for docs/spectrum_plan.md §2's new stdlib/sys tree:
      # the suite runner compiles Virtio through the full pipeline (its
      # 021-virtio cases pin the use-after-submit linearity failure), while
      # this step keeps `--target-type=tc` itself honest on the module pair.
      - name: typecheck stdlib/sys (Virtio)
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; ./austral compile stdlib/sys/Virtio.aui,stdlib/sys/Virtio.aum --target-type=tc'

      - name: examples
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; bash run-examples.sh'

      - name: build the stdlib
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; make -C standard clean && make -C standard'

      - name: test the stdlib
        run: nix develop -c bash -c './standard/test_bin'

      # §13.39: every emitter rewrite since §13.30 is justified by "the artifacts
      # do not move", and each proof of that was a hand-run `cmp`. This gate is
      # the same claim as a check: FockPair in its three modes, compared by size
      # and sha256 with scripts/lean-typing-proof.golden.tsv. The export it needs
      # is corpus and `mm0/exports/` is gitignored, so this checkout has none and
      # the gate reports an explained gap and exits 0 — it never reports a pass.
      # Where the corpus is restored (a developer tree, the corpus jobs) the same
      # command fails on any byte drift.
      - name: emitter byte-identity (lean-typing-proof)
        run: nix develop -c bash -c 'python3 scripts/check-lean-typing-proof'

      - name: upload compiler binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: austral-linux-bin
          path: austral
          retention-days: 1

      - name: clean
        run: make clean

      - name: assert executable does not exist
        run: test ! -f austral

  # ── Cranelift JIT + safestos integration stack ────────────────────
  # H1 (PLAN_HARNESS): maintenance-invariant gate. Requires the sibling
  # unfer checkout (the gate cross-checks the symbol census against unfer_ffi).
  verify-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout australVM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      # actions/checkout refuses paths outside $GITHUB_WORKSPACE ("Repository
      # path ... is not under ..." guard), so the sibling unfer (a Cargo.toml
      # path dep at ../../../unfer) is cloned with plain git.
      - name: Checkout unfer as sibling (path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer

      # `arctic` is an optional dependency of the bridge, but cargo resolves
      # every path dependency in the manifest whether the feature is on or not,
      # so a missing `../dynamic-arctic` fails the build with "no matching
      # package named `arctic` found" before any crate is compiled.
      - name: Checkout dynamic-arctic as sibling (unfer_consensus dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      - name: install nix
        uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703  # nixbuild/nix-quick-install-action@v30

      - name: nix cache
        uses: nix-community/cache-nix-action@d8cff2f74b9341e0d90fbf3c0c0212a161ceaef6  # nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      # `rustflags: ""`: this action defaults RUSTFLAGS to `-D warnings`, and a
      # path dependency's warnings are compiled here too — `fock_sirk`'s dead
      # `neg` and an `unused_mut` in `unfer_consensus` then fail every cargo
      # build with exit 101, in repositories this one cannot edit. The deny
      # belongs on this crate alone, which is what the `clippy (deny warnings)`
      # job's own `-- -D warnings` does.
      - name: Install Rust toolchain (bridge)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # The artifact checks need the compiler and the bridge, not just the
      # sources: `make bridge` builds the release `.so` and then `austral`.
      # Without this the gate has to report W2/W5/W6 and the census as gaps.
      - name: make bridge (compiler + JIT bridge + cps2cell)
        run: nix develop -c bash -c 'make bridge'

      # The gate re-emits the certificate and hashes the emitted object through
      # the bridge, so it runs against the tree just built. The `ocaml` shell
      # provides python3, mm0 and dune; `make bridge` above is what put the
      # `.so` and `austral` in place.
      - name: Run scripts/verify-invariants against the built tree (H1)
        run: nix develop "git+file://$PWD#ocaml" -c bash scripts/verify-invariants

  jit-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout australVM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      # actions/checkout refuses paths outside $GITHUB_WORKSPACE, so the
      # sibling unfer is cloned with plain git (see verify-invariants above).
      # unfer_ffi -> unfer_consensus -> arctic (../../dynamic-arctic from the
      # unfer repo), so dynamic-arctic is cloned as unfer's sibling too.
      - name: Checkout unfer as sibling (Cargo.toml path dep ../../../unfer/unfer_ffi)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - name: Checkout dynamic-arctic as sibling (unfer_consensus dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      # `rustflags: ""` — see the sibling-warning note in the verify-invariants
      # job; without it the unfer path deps' warnings are errors here.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache cranelift / unfer_ffi build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/safestos/cranelift/target
            ${{ github.workspace }}/../unfer/target
          key: jit-${{ runner.os }}-${{ hashFiles('safestos/cranelift/Cargo.lock', 'safestos/cranelift/**/*.rs', 'safestos/cranelift/Cargo.toml') }}
          restore-keys: |
            jit-${{ runner.os }}-

      - name: Build cranelift with test-stubs (unit tests)
        run: cargo build --features test-stubs -p austral_cranelift_bridge
        working-directory: safestos/cranelift

      - name: Run unit tests (test-stubs)
        # The failing test's name and message are only in the job log (admin
        # rights); quote the tail as annotations. Same for ci.yml's suite.
        run: |
          status=0
          out=$(cargo test --features test-stubs -p austral_cranelift_bridge 2>&1) || status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$out" | grep -E '^(---- |test .* FAILED|error)' -A 4 | tail -40 | while IFS= read -r line; do
              echo "::error title=cargo test::$line"
            done
            exit "$status"
          fi
        working-directory: safestos/cranelift

      - name: Build cranelift release with unfer-kernel
        run: cargo build --release --features unfer-kernel -p austral_cranelift_bridge
        working-directory: safestos/cranelift

      - name: Build safestos runtime (libSafestOS.so) + hot-swap cells
        run: make -C safestos lib/libSafestOS.so cells/counter_v1.so cells/counter_v2.so

      - name: Build hotswap_e2e test binary
        run: make -C safestos test/hotswap_e2e

      - name: Run hotswap end-to-end test
        run: LD_LIBRARY_PATH=lib make -C safestos hotswap-test

      - name: Install Nix (for OCaml toolchain)
        uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703  # nixbuild/nix-quick-install-action@v30

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@d8cff2f74b9341e0d90fbf3c0c0212a161ceaef6  # nix-community/cache-nix-action@v6
        with:
          primary-key: nix-jit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-jit-${{ runner.os }}-${{ runner.arch }}

      # LD_LIBRARY_PATH points at the bridge .so's build dir (the ci.yml
      # pattern): $HOME/.local/lib does not exist on a fresh runner and the
      # silent cp fallback made these steps fail to load the bridge.
      - name: Build OCaml compiler with JIT bridge
        run: nix develop -c bash -c 'make bridge && export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; dune build bin/ lib/ test/'

      - name: Run OCaml JIT unit tests (JitTest)
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; dune runtest'

      - name: Run panic-guard suites explicitly (CliEngineTest / JitTest)
        # dune runtest skips suites it considers up-to-date, so the sentinel
        # rendering (CliEngineTest) and bridge-boundary (JitTest) suites are
        # forced to actually execute — a regression fails the job loudly.
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$PWD/safestos/cranelift/target/release; dune exec --force test/CliEngineTest.exe && dune exec --force test/JitTest.exe'

      - name: Build modhost
        run: cargo build --release --features unfer-kernel --bin modhost
        working-directory: safestos/cranelift

      - name: Build unfer_ffi (release, for demo_module)
        run: cargo build --release -p unfer_ffi
        working-directory: ${{ github.workspace }}/../unfer

      - name: Run demo_module positive + UK-4001 gate test
        # The B6-era inline invocation drifted from the fork's current JIT: it
        # omitted --auth-manifest (the JIT denies kernel calls without it, so
        # kernelModelCreateStr could never resolve) and grepped an obsolete
        # output pattern. The canonical, maintained driver is
        # unfer/tools/module_builder (also used by run_demo.sh) — invoke it so
        # this gate cannot drift from the driver's logic again. It rebuilds
        # the bridge with its own feature set, so it is self-contained.
        run: nix develop -c bash ${{ github.workspace }}/../unfer/tools/module_builder run ${{ github.workspace }}/../unfer/demo_module --deny uk_event_probability

  # ── avm-pkg engine (safestos/pkg) ─────────────────────────────────
  # The avm-pkg workspace (PLAN_avm_pkg.md §6.2) is deliberately standalone:
  # pure crates with no path deps outside safestos/pkg (the bridge is reached
  # by spawning `cps2cell`, never linked), so this job needs no sibling
  # checkouts and no nix toolchain. The engine shipped 10-17 with 108 unit
  # tests that no CI job ran (cross-project review round 4, §9a) — they were
  # green but claimed by nobody, exactly the rot class this repo's gate
  # culture exists to catch. This job closes the hole.
  avm-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout australVM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache avm-pkg build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # actions/cache@v4
        with:
          path: ${{ github.workspace }}/safestos/pkg/target
          key: avm-pkg-${{ runner.os }}-${{ hashFiles('safestos/pkg/Cargo.lock', 'safestos/pkg/**/*.rs', 'safestos/pkg/**/Cargo.toml') }}
          restore-keys: |
            avm-pkg-${{ runner.os }}-

      - name: Run avm-pkg tests (130 passed / 6 ignored, 7 binaries, measured 2026-11-18)
        run: cargo test --workspace
        working-directory: safestos/pkg

      # The two §3 hot-store rows as a smoke, on a release binary because a
      # debug build's per-call overhead would measure the wrong thing: a
      # resident acquire must stay under 1 µs and a 50 MiB evicted fault-in
      # under 15 ms. Local reference: 30 ns and 6.5 ms (2026-11-18).
      #
      # A hosted runner is a shared, virtualised machine, and the rows are
      # measured on this host, not derived from the code: the same commit reads
      # 30 ns / 6 ms here and misses the fault-in row under a noisy neighbour
      # (measured 2026-11-23: the job passed and failed on consecutive runs of
      # one tree). On such a runner the row is *reported*, as a gap with the
      # measured number, never as a pass — `AVM_LATENCY_REFERENCE=1` on a
      # machine that can hold the rows turns the same run into the gate. The
      # rows' own predicate stays unit-tested in avm-cli
      # (`latency_regression`), so this job's runner choice cannot hide a
      # broken predicate.
      - name: Hot-store latency smoke (acquire < 1 µs, 50 MiB fault-in < 15 ms)
        run: |
          cargo build --release -p avm-cli
          status=0
          out=$(./target/release/avm-pkg hot-bench --require 2>&1) || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # A regression still has to arrive with its number: the report is in
          # the job log, which needs admin rights, so quote its tail either way.
          if [ "${AVM_LATENCY_REFERENCE:-0}" = "1" ]; then
            printf '%s\n' "$out" | tail -3 | while IFS= read -r line; do
              echo "::error title=hot-bench::$line"
            done
            exit "$status"
          fi
          printf '%s\n' "$out" | tail -3 | while IFS= read -r line; do
            echo "::warning title=hot-store latency (not enforced on this runner)::$line"
          done
          echo "[gap] hot-store latency rows measured, not enforced here" \
            "(hosted runner; set AVM_LATENCY_REFERENCE=1 on a reference machine):"
          printf '%s\n' "$out" | tail -1
          exit 0
        working-directory: safestos/pkg

  # ── Nix → AustralVM translations end to end (examples/nix-pkg) ─────
  # The pairs are verified by dnx-verify (../dnx), packaged by avm-pkg, and
  # then executed through `avm-pkg load --exec`. That needs three siblings:
  # unfer and dynamic-arctic because the bridge path-depends on them (the
  # same clones `build-and-test-linux` makes), and dnx because dnx-verify
  # path-depends on `../../../unfer/logos`. The job builds the compiler and
  # bridge inside the flake (`austral` has no rpath and must run under the
  # devshell), builds the two Rust binaries with the host toolchain, and
  # runs the script inside the devshell (it compiles the executor with
  # `rustc` and sets LD_LIBRARY_PATH itself).
  nix-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout australVM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      # Plain git, not actions/checkout: the paths are outside
      # $GITHUB_WORKSPACE, which actions/checkout refuses.
      - name: Checkout unfer, dynamic-arctic and dnx as siblings
        run: |
          git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
          git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic
          # `dnx-verify` is not on dnx's `main` — the path returns 404 there and
          # the crate lives on `feat/dnx-verify` (measured 2026-11-23), so a
          # clone of main fails this job at `cargo build -p dnx-verify` with
          # "package ID specification did not match any packages". Pin the
          # commit the example was verified against instead of tracking a
          # branch: this job should measure australVM, not dnx's tip.
          git clone --filter=blob:none https://github.com/leonardopedro/dnx.git ../dnx
          git -C ../dnx checkout 51f2fd75aa0a559a6f34c158c1e59d3d69b41350

      - name: install nix
        uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703  # nixbuild/nix-quick-install-action@v30

      - name: nix cache
        uses: nix-community/cache-nix-action@d8cff2f74b9341e0d90fbf3c0c0212a161ceaef6  # nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      # Builds the bridge .so and cps2cell, then the `austral` binary
      # against them (the script needs both).
      - name: make bridge (compiler + JIT bridge + cps2cell)
        run: nix develop -c bash -c 'make bridge'

      # `rustflags: ""` — see the sibling-warning note in verify-invariants.
      - name: Install Rust toolchain (dnx-verify + avm-pkg)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build dnx-verify
        run: cargo build --release -p dnx-verify
        working-directory: ../dnx

      - name: Build avm-pkg
        run: cargo build --release -p avm-cli
        working-directory: safestos/pkg

      # The pairs must all meet their expectations (13 equivalent, the
      # declared-mismatch control different), every cell must round-trip,
      # and all thirteen cells must return their Nix value — Float64
      # included, as an IEEE-754 bit pattern in the CPS one-word ABI.
      - name: Verify, package and execute the translation pairs
        run: nix develop -c bash ./examples/nix-pkg/run.sh

      # The execution step above is only meaningful if a broken linker fails
      # it. This control reverts the rel32 fix, rebuilds avm-pkg, and requires
      # the cell to stop returning 42; it also requires the Cedar Execute gate
      # to refuse a denied cell. It restores the source and rebuilds afterwards.
      - name: Negative control (broken linker, dead gate)
        run: bash ./examples/nix-pkg/linker-control.sh

      # Provider-cell linking: the owner cell imports `double`, so it must not
      # link alone; with --provider it resolves into the second image and runs.
      - name: Multi-cell image with a provider cell
        run: nix develop -c bash ./examples/nix-pkg/multi-cell.sh

      # The plan closure is resolved from the store by derivation id (there is
      # no --cells directory). A dependency that was never built must be
      # refused by derivation name and id, before any owner cell is read.
      - name: Negative control (never-built plan dependency)
        run: bash ./examples/nix-pkg/missing-provider.sh

      # The OCaml suite is the slow half of the tree (build, typecheck and 18
      # test suites), so it gets its own step with a budget larger than the
      # local default; the elapsed seconds are printed for the job log.
      - name: OCaml suite (build, typecheck, tests)
        timeout-minutes: 40
        run: |
          start=$(date +%s)
          nix develop "git+file://$PWD#ocaml" -c make test
          echo "ocaml-suite: $(( $(date +%s) - start ))s"

      # The standalone `verify-invariants` job runs in a bare shell, so the
      # checks that need built artifacts (W2/W5/W6 re-emit and the object
      # digest, the symbol census against unfer) report as gaps there. This
      # step runs the same gate against the tree this job just built, with
      # python3 from the shell and unfer already checked out as a sibling.
      - name: verify-invariants (against the built tree)
        timeout-minutes: 15
        run: nix develop "git+file://$PWD#ocaml" -c bash scripts/verify-invariants
