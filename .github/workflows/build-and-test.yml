name: Build and Test
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  # ── Upstream OCaml CI, migrated from nix-shell (23.05) to the flake ─
  # The fork links the cranelift JIT bridge (.so, DT_NEEDED, no rpath) into
  # every binary, so this job needs the same sibling checkouts as jit-stack
  # and LD_LIBRARY_PATH for every step that runs the `austral` binary.
  build-and-test-linux:
    strategy:
      fail-fast: true

    runs-on:
      - ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3

      # actions/checkout refuses paths outside $GITHUB_WORKSPACE ("Repository
      # path ... is not under ..." guard), so the sibling unfer + dynamic-arctic
      # are cloned with plain git: the bridge Cargo.toml path-depends on
      # ../../../unfer, which in turn path-depends on ../../dynamic-arctic via
      # unfer_consensus.
      - name: Checkout unfer as sibling (bridge path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - name: Checkout dynamic-arctic as sibling (unfer_consensus dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      - name: install nix
        uses: nixbuild/nix-quick-install-action@v30

      - name: nix cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      # `make bridge` (flake env): builds the Rust bridge .so via cargo, then
      # the OCaml compiler against it, and regenerates the gitignored
      # lib/BuiltInModules.ml (concat_builtins.py) on the way. A plain `make`
      # cannot work: the fork's dune files link the .so unconditionally.
      - name: make (build bridge + compiler)
        run: nix develop -c bash -c 'make bridge'

      - name: make test
        run: nix develop -c bash -c 'make test'

      # make test copies the .so to $HOME/.local/lib; the `austral` binary has
      # no rpath, so the runtime needs LD_LIBRARY_PATH for these steps.
      - name: end-to-end tests
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$HOME/.local/lib; python test-programs/runner.py'

      - name: examples
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$HOME/.local/lib; bash run-examples.sh'

      - name: build the stdlib
        run: nix develop -c bash -c 'export LD_LIBRARY_PATH=$HOME/.local/lib; make -C standard clean && make -C standard'

      - name: test the stdlib
        run: nix develop -c bash -c './standard/test_bin'

      - name: upload compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: austral-linux-bin
          path: austral
          retention-days: 1

      - name: clean
        run: make clean

      - name: assert executable does not exist
        run: test ! -f austral

  # ── Cranelift JIT + safestos integration stack ────────────────────
  # H1 (PLAN_HARNESS): maintenance-invariant gate. Requires the sibling
  # unfer checkout (the gate cross-checks the symbol census against unfer_ffi).
  verify-invariants:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout australVM
        uses: actions/checkout@v4

      # actions/checkout refuses paths outside $GITHUB_WORKSPACE ("Repository
      # path ... is not under ..." guard), so the sibling unfer (a Cargo.toml
      # path dep at ../../../unfer) is cloned with plain git.
      - name: Checkout unfer as sibling (path dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer

      - name: Run scripts/verify-invariants (H1)
        run: bash scripts/verify-invariants

  jit-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout australVM
        uses: actions/checkout@v4

      # actions/checkout refuses paths outside $GITHUB_WORKSPACE, so the
      # sibling unfer is cloned with plain git (see verify-invariants above).
      # unfer_ffi -> unfer_consensus -> arctic (../../dynamic-arctic from the
      # unfer repo), so dynamic-arctic is cloned as unfer's sibling too.
      - name: Checkout unfer as sibling (Cargo.toml path dep ../../../unfer/unfer_ffi)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/unfer.git ../unfer
      - name: Checkout dynamic-arctic as sibling (unfer_consensus dep)
        run: git clone --depth 1 --branch main https://github.com/leonardopedro/dynamic-arctic.git ../dynamic-arctic

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cranelift / unfer_ffi build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/safestos/cranelift/target
            ${{ github.workspace }}/../unfer/target
          key: jit-${{ runner.os }}-${{ hashFiles('safestos/cranelift/Cargo.lock', 'safestos/cranelift/**/*.rs', 'safestos/cranelift/Cargo.toml') }}
          restore-keys: |
            jit-${{ runner.os }}-

      - name: Build cranelift with test-stubs (unit tests)
        run: cargo build --features test-stubs -p austral_cranelift_bridge
        working-directory: safestos/cranelift

      - name: Run unit tests (test-stubs)
        run: cargo test --features test-stubs -p austral_cranelift_bridge
        working-directory: safestos/cranelift

      - name: Build cranelift release with unfer-kernel
        run: cargo build --release --features unfer-kernel -p austral_cranelift_bridge
        working-directory: safestos/cranelift

      - name: Build safestos runtime (libSafestOS.so) + hot-swap cells
        run: make -C safestos lib/libSafestOS.so cells/counter_v1.so cells/counter_v2.so

      - name: Build hotswap_e2e test binary
        run: make -C safestos test/hotswap_e2e

      - name: Run hotswap end-to-end test
        run: LD_LIBRARY_PATH=lib make -C safestos hotswap-test

      - name: Install Nix (for OCaml toolchain)
        uses: nixbuild/nix-quick-install-action@v30

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-jit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-jit-${{ runner.os }}-${{ runner.arch }}

      - name: Build OCaml compiler with JIT bridge
        run: nix develop -c bash -c 'make bridge && cp -f safestos/cranelift/target/release/libaustral_cranelift_bridge.so $HOME/.local/lib/ 2>/dev/null; LD_LIBRARY_PATH=$HOME/.local/lib dune build bin/ lib/ test/'

      - name: Run OCaml JIT unit tests (JitTest)
        run: nix develop -c bash -c 'LD_LIBRARY_PATH=$HOME/.local/lib dune runtest'

      - name: Run panic-guard suites explicitly (CliEngineTest / JitTest)
        # dune runtest skips suites it considers up-to-date, so the sentinel
        # rendering (CliEngineTest) and bridge-boundary (JitTest) suites are
        # forced to actually execute — a regression fails the job loudly.
        run: nix develop -c bash -c 'LD_LIBRARY_PATH=$HOME/.local/lib dune exec --force test/CliEngineTest.exe && LD_LIBRARY_PATH=$HOME/.local/lib dune exec --force test/JitTest.exe'

      - name: Build modhost
        run: cargo build --release --features unfer-kernel --bin modhost
        working-directory: safestos/cranelift

      - name: Build unfer_ffi (release, for demo_module)
        run: cargo build --release -p unfer_ffi
        working-directory: ${{ github.workspace }}/../unfer

      - name: Run demo_module positive + UK-4001 gate test
        # Literal block (`|`): a multi-line single-quoted YAML scalar would
        # fold the newlines (and the embedded `: ` at line 170 previously made
        # the file fail to parse entirely — this workflow had never run).
        run: |
          nix develop -c bash -c '
            HERE="${{ github.workspace }}"
            UNFER_DIR="$HERE/../unfer"
            CL_DIR="$HERE/safestos/cranelift"
            LIBDIR="$CL_DIR/target/release"
            AUSTRAL="$HERE/_build/default/bin/austral.exe"
            MODHOST="$CL_DIR/target/release/modhost"
            MODULE_DIR="$UNFER_DIR/demo_module"
            MODULE_TOML="$MODULE_DIR/module.toml"

            echo ">> POSITIVE: demo_module via CPS-JIT"
            JIT_OUT=$(LD_LIBRARY_PATH="$LIBDIR" "$AUSTRAL" compile \
              "$HERE/examples/kernel/UnferKernel.aui,$HERE/examples/kernel/UnferKernel.aum" \
              "$MODULE_DIR/src/DemoModule.aui,$MODULE_DIR/src/DemoModule.aum" \
              --use-cps-jit --target-type=tc 2>&1)

            if echo "$JIT_OUT" | grep -qE "CPS JIT: Execution result: [1-9][0-9]*"; then
              echo "PASS: demo_module JIT execution succeeded."
            else
              echo "FAIL: demo_module JIT execution." >&2
              echo "$JIT_OUT" >&2
              exit 1
            fi

            echo ">> AUTHORIZATION: grant vs. revocation (UK-4001)"
            MODULE_NAME=$(grep -m1 "^name\s*=" "$MODULE_TOML" | sed "s/.*=\s*\"\(.*\)\"/\1/")
            DENY_SYM="uk_event_probability"

            # Positive: full manifest authorizes the symbol
            if "$MODHOST" authorize "$MODULE_TOML" "$MODULE_NAME" "$DENY_SYM"; then
              echo "PASS: granted manifest authorizes $DENY_SYM."
            else
              echo "FAIL: full manifest should authorize $DENY_SYM." >&2
              exit 1
            fi

            # Negative: strip the deny symbol
            STRIPPED=$(mktemp)
            trap "rm -f $STRIPPED" EXIT
            grep -v "$DENY_SYM" "$MODULE_TOML" > "$STRIPPED"
            if "$MODHOST" authorize "$STRIPPED" "$MODULE_NAME" "$DENY_SYM" 2>/dev/null; then
              echo "FAIL: stripped manifest must DENY $DENY_SYM." >&2
              exit 1
            else
              echo "PASS: revoking $DENY_SYM denies with UK-4001."
            fi

            echo "demo_module: ALL TESTS PASSED"
          '
